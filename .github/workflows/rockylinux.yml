# RockyLinux containerised builds
name: RockyLinux
on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rockylinux-job:
    runs-on: ubuntu-latest
    container: quay.io/rockylinux/rockylinux:10
    strategy:
      fail-fast: false

    steps:
    - name: Install dependencies
      run: |
        yum install -y autoconf automake make gcc perl-Data-Dumper zlib-devel bzip2 bzip2-devel xz-devel curl-devel openssl-devel git diffutils perl-FindBin ncurses-devel

    - name: Checkout
      # This is actions/checkout@v6.0.2
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        persist-credentials: false

    - name: Clone htslib
      run: |
        git config --global --add safe.directory `pwd`
        mkdir -p hidden-htslib
        htslib_pr=`git log -2 --format='%s' | sed -n 's/.*htslib#\([0-9]*\).*/\1/p'`
        .ci_helpers/clone ${GITHUB_REPOSITORY_OWNER} htslib hidden-htslib ${GITHUB_HEAD_REF:-$GITHUB_REF_NAME} $htslib_pr

    - name: Build htslib
      run: |
        htsdir="`realpath .`/installed-htslib"
        echo "htsdir=${htsdir}" >> "$GITHUB_ENV"

        cd hidden-htslib
        autoreconf -i
        ./configure --prefix="$htsdir" --enable-werror --enable-plugins CFLAGS='-g -O3 -std=c99 -pedantic -Wno-sign-conversion'
        make -j 5 &&
        make install

    - name: Configure samtools
      run: |
        autoreconf -i
        ./configure --with-htslib=$htsdir --enable-werror --enable-plugins CFLAGS='-g -O3 -std=c99 -pedantic' LDFLAGS="-Wl,-rpath=${htsdir}/lib"

    - name: Compile
      run: |
          make -j5

    - name: Check
      run: |
          make check BGZIP=$htsdir/bin/bgzip
