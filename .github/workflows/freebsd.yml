name: FreeBSD
on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: ['x86_64']
        #arch: ['x86_64', 'aarch64']  # currently disabled for speed
        # The OS supports riscv64 and powerpc64, but there are no prebuilt
        # binaries so we'd have to build dependencies from source
        #arch: ['x86_64', 'aarch64', 'riscv64', 'powerpc64']

    name: FreeBSD (${{ matrix.arch }})
    steps:
    # Outside VM
    - name: Install git
      run: |
        sudo apt-get install -y git

    - name: Checkout
      # This is actions/checkout@v6.0.2
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        fetch-depth: 1

    - name: Clone htslib
      run: |
        git config --global --add safe.directory `pwd`
        mkdir -p hidden-htslib
        htslib_pr=`git log -2 --format='%s' | sed -n 's/.*htslib#\([0-9]*\).*/\1/p'`
        .ci_helpers/clone ${GITHUB_REPOSITORY_OWNER} htslib hidden-htslib ${GITHUB_HEAD_REF:-$GITHUB_REF_NAME} $htslib_pr
          
    # Outside/Inside VM
    - name: Setup VM
      uses: vmactions/freebsd-vm@v1
      with:
        # Note to use this you may need to merge all the steps into one.
        #debug-on-error: true
        #vnc-password: ${{ secrets.VNC_PASSWORD }}
        arch: ${{ matrix.arch }}
        usesh: true
        cpu: 4
        prepare: |
          pkg update
          pkg install -y autoconf automake bash curl bzip2 gmake libdeflate perl5
        run: |
          # Useful diagnostics
          pwd
          freebsd-version
          uname -a
          sysctl hw.ncpu
          sysctl hw.physmem
          sysctl hw.usermem

    # Inside VM
    - name: Build htslib
      shell: freebsd {0}
      run: |
        htsdir="`realpath .`/installed-htslib"

        # The C library does casting in CMSG_SPACE, breaking ref_cache.
        # It also doesn't like -fstack-protector, but we only check compile
        # rather than link time, so disable that too.  We add to CPPFLAGS
        # as it occurs after REF_CACHE_EXTRA_C_FLAGS.
        cd hidden-htslib
        autoreconf -i
        ./configure --prefix="$htsdir" --with-libdeflate --enable-werror --enable-plugins CFLAGS="-g -O3 -fsanitize=address,undefined -DHTS_ALLOW_UNALIGNED=0 -Wno-format-truncation -Wno-format-overflow" CPPFLAGS="-I/usr/local/include" LDFLAGS="-fsanitize=address,undefined -L/usr/local/lib -Wl,-R/usr/local/lib"
        gmake -j 5 &&
        gmake install

    - name: Configure samtools
      shell: freebsd {0}
      run: |
        htsdir="`realpath .`/installed-htslib"
        autoreconf -i
        ./configure --with-htslib=$htsdir --enable-werror CFLAGS="-g -O3 -fsanitize=address,undefined -DHTS_ALLOW_UNALIGNED=0 -Wno-format-truncation -Wno-format-overflow" CPPFLAGS="-I/usr/local/include" LDFLAGS="-fsanitize=address,undefined -L/usr/local/lib -Wl,-R/usr/local/lib -Wl,-rpath=${htsdir}/lib"

    - name: Build
      shell: freebsd {0}
      run: |
        gmake -j5

    - name: Test
      shell: freebsd {0}
      run: |
        htsdir="`realpath .`/installed-htslib"
        gmake check BGZIP=$htsdir/bin/bgzip
